# workline's tester answering an objection, on GitHub Actions — copy to
# .github/workflows/workline-answer.yml, with workline-objection.yml beside it.
# propose: the agent (secret CLAUDE_CODE_OAUTH_TOKEN), no write token; it runs
# your test command on the Draft's head: install your test runner there.
# apply: the App's key (environment workline-app), no AI key, from the
# default branch's checkout. Why: docs/objection-jobs.md.
name: workline answer
on:
  workflow_run: {workflows: [workline objection], types: [completed]}
  # By hand, and by the end of an answer (the next objection waiting) and by
  # workline-develop.yml's reconciler (an objection no comment wakes): the
  # Draft's branch, workline/tester/*.
  workflow_dispatch:
    inputs:
      branch: {description: "the tester's Draft branch, workline/tester/*", required: true}
      chain: {description: "the answers chained before this one: 4 at most, then the reconciler resumes", required: false, default: "0"}
permissions: {}
# One answer at a time per Draft: the next takes the objection waiting after it.
concurrency: {group: "workline-answer-${{ github.event.workflow_run.head_branch || inputs.branch }}", cancel-in-progress: false}

env:
  WORKLINE_VERSION: v0.89.2          # a release of workline: update it to take a newer one (x-release-please-version)
  WORKLINE_RUNS_DIR: ${{ github.workspace }}/.workline-runs

jobs:
  propose:
    if: >-
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.branch, 'workline/tester/')) ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        startsWith(github.event.workflow_run.head_branch, 'workline/tester/'))
    runs-on: ubuntu-latest
    timeout-minutes: 90   # above the tester's caps, ai-max-seconds and 3 × suite-max-seconds (50 min), with room for a build
    permissions: {contents: read, pull-requests: read, issues: read}
    env: {HAS_CLAUDE: "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}"}
    outputs:
      branch: ${{ steps.head.outputs.branch }}
      head: ${{ steps.head.outputs.head }}
      state: ${{ steps.head.outputs.state }}
      run: ${{ steps.answer.outputs.run }}
      status: ${{ steps.answer.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: workline
        run: |
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"; cd "$RUNNER_TEMP"
          get() { curl -fsSLO "$1/$2" && curl -fsSL "$1/$3" | grep " $2\$" | sha256sum -c - && tar -xzf "$2" -C "$bin" "$4"; }
          get "https://github.com/JN0V/workline/releases/download/$WORKLINE_VERSION" workline_linux_amd64.tar.gz checksums.txt workline
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/workline" version
      - name: Claude, when the repository gives its token
        if: env.HAS_CLAUDE == 'true'
        run: npm install -g @anthropic-ai/claude-code
      # Your test runner here: the tester proves a rewrite red on the base
      # with the project's `test-command`.
      # TraceGlass: JDK 17, the Android SDK and Gradle, to prove a rewritten
      # test red on its base.
      - uses: ./.github/actions/workline-setup
      # The Draft's branch and the head the answer reads: its open pull
      # request's tip now, never the objection run's head_sha, which a
      # re-run or a push since leaves behind. Its state, the tip
      # and each objection waiting: an answer ran on that same state
      # already (refused, failed, wrote none), none again, no agent.
      - name: The Draft's head
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          WORKLINE_APP_ID: ${{ vars.WORKLINE_APP_ID }}
          BRANCH: ${{ github.event.workflow_run.head_branch || inputs.branch }}
        run: |
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          got=$(gh pr list --head "$BRANCH" --state open --json number,headRefOid,isCrossRepository --jq '[.[] | select(.isCrossRepository | not)][0] // empty | "\(.number) \(.headRefOid)"')
          [ -n "$got" ] || { echo "no open pull request from $BRANCH in this repository: nothing to answer"; exit 0; }
          # A state not read (a release before --state, still pinned, which
          # this workflow must run on; or the forge failing): answered as
          # before, due, none marked after.
          if ! said=$(workline test answer --merge-request "${got%% *}" --state --forge github); then
            echo "::warning title=workline::the Draft's state not read: answered as due, its state not marked"
            said="due unread"
          fi
          case "$said" in
            "due "*) ;;
            *) echo "no answer: ${said:-none waits}" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0 ;;
          esac
          echo "head=${got#* }" >> "$GITHUB_OUTPUT"
          echo "state=${said#due }" >> "$GITHUB_OUTPUT"
      - name: The answer (proposed only)
        id: answer
        if: steps.head.outputs.head != ''
        env:
          GH_TOKEN: ${{ github.token }}
          WORKLINE_APP_ID: ${{ vars.WORKLINE_APP_ID }}   # the App whose comments keep the tester's record
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BRANCH: ${{ steps.head.outputs.branch }}
          HEAD_SHA: ${{ steps.head.outputs.head }}
        run: |
          ai=none; [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] && ai=claude
          pr=$(gh pr list --head "$BRANCH" --state open --json number,isCrossRepository --jq '[.[] | select(.isCrossRepository | not)][0].number // empty')
          [ -n "$pr" ] || { echo "no open pull request from $BRANCH: nothing to answer"; exit 0; }
          # The Draft's tip; the engine already set up from the default
          # branch's checkout.
          git checkout -q -B "$BRANCH" "$HEAD_SHA"
          status=0
          workline test answer --merge-request "$pr" --ai "$ai" --no-apply --forge github --json > answer.json || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # A run left to apply, by name; none when it stopped before. A refused
          # answer is no pending run, but its folder holds out/on-block.yaml, the
          # comment saying why in the objection's thread: it is applied too.
          # An answer.json that does not parse (the engine crashed) ends no step: the Verdict says it.
          run=$(jq -r '(.pending // [])[0] // empty | split("/") | last' answer.json 2>/dev/null) || run=
          if [ -z "$run" ] && [ "$status" != 3 ]; then
            d=$(jq -r '."run-dir" // empty | split("/") | last' answer.json 2>/dev/null) || d=
            [ -z "$d" ] || [ ! -s "$WORKLINE_RUNS_DIR/$d/out/on-block.yaml" ] || run=$d
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          jq -r '.summary // empty' answer.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          { jq -r '.summary // empty' answer.json; jq -r '.findings[]? | "- \(.rule): \(.message)"' answer.json; } > answer-summary.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always() && steps.answer.outputs.status != ''   # a refused answer leaves no pending run: kept all the same
        with: {name: workline-answer, path: ".workline-runs\nanswer.json", include-hidden-files: true, retention-days: 1}
      - name: Verdict
        env: {STATUS: "${{ steps.answer.outputs.status }}"}
        run: |
          if [ "$STATUS" = 3 ]; then
            echo "::warning title=workline::the agent could not be reached; the objection waits for the next one"
            exit 0
          fi
          if [ "${STATUS:-0}" != 0 ]; then
            # The reason in the log: the answer's summary and findings, as an error annotation.
            msg=$(cat answer-summary.txt 2>/dev/null | head -c 2000 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=workline::${msg:-the answer ended with status $STATUS, see answer.json}"
          fi
          exit "${STATUS:-0}"
      # What this job's agent calls spent, a line a run: role, target,
      # calls, tokens, seconds; no prompt, no diff. Kept 14 days for the
      # weekly sample's tokens; the run folders
      # keep their day. Also in a cancelled run (a newer push's), named so, not always(); in each
      # attempt of a re-run, its own artifact; not in a merge queue's, which asks no agent. The
      # first release after v0.75.0; an engine before it keeps none, said.
      - name: The runs' tally
        if: "(success() || failure() || cancelled()) && github.event_name != 'merge_group'"
        run: 'workline sample --tally workline-tally.jsonl || echo "workline: no tally kept"'
      - uses: actions/upload-artifact@v4
        if: "(success() || failure() || cancelled()) && github.event_name != 'merge_group'"
        with: {name: "workline-tally-${{ github.job }}-${{ github.run_attempt }}", path: workline-tally.jsonl, if-no-files-found: ignore, retention-days: 14}

  apply:
    needs: propose
    if: always() && needs.propose.outputs.state != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: workline-app       # the App's key: the default branch only
    permissions: {contents: write, pull-requests: write, issues: write, actions: write}
    steps:
      - id: app
        if: vars.WORKLINE_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WORKLINE_APP_ID }}
          private-key: ${{ secrets.WORKLINE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || github.token }}
      - name: workline
        run: |
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"; cd "$RUNNER_TEMP"
          get() { curl -fsSLO "$1/$2" && curl -fsSL "$1/$3" | grep " $2\$" | sha256sum -c - && tar -xzf "$2" -C "$bin" "$4"; }
          get "https://github.com/JN0V/workline/releases/download/$WORKLINE_VERSION" workline_linux_amd64.tar.gz checksums.txt workline
          echo "$bin" >> "$GITHUB_PATH"
      # propose ran the Draft's code: its folder is data, outside the checkout.
      - uses: actions/download-artifact@v4
        if: needs.propose.outputs.run != ''
        with: {name: workline-answer, path: "${{ runner.temp }}/workline-runs"}
      # Only what the Draft's line may do, to it, at the event's head: the
      # repository, roles and forge this job's (`apply --from-merge-request`).
      - if: needs.propose.outputs.run != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          APP: ${{ steps.app.outputs.app-slug }}
          WORKLINE_APP: ${{ steps.app.outputs.app-slug }}   # workline's own account: the records it trusts
          # Two upload paths root the artifact at the workspace: the runs are in its .workline-runs.
          WORKLINE_RUNS_DIR: ${{ runner.temp }}/workline-runs/.workline-runs
          RUN: ${{ needs.propose.outputs.run }}
          BRANCH: ${{ needs.propose.outputs.branch }}
          HEAD_SHA: ${{ needs.propose.outputs.head }}
        run: |
          printf '%s' "$RUN" | grep -Eqx '[0-9]{8}T[0-9]{6}\.[0-9]{9}-[a-z0-9-]+' && [ -d "$WORKLINE_RUNS_DIR/$RUN" ] ||
            { echo "::error title=workline::propose named no run of its own: $RUN"; exit 1; }
          NUMBER=$(gh pr list --head "$BRANCH" --state open --json number,isCrossRepository --jq '[.[] | select(.isCrossRepository | not)][0].number // empty')
          [ -n "$NUMBER" ] || { echo "no open pull request from $BRANCH: nothing to apply"; exit 0; }
          if [ -n "$APP" ]; then
            git config user.name "$APP[bot]"
            git config user.email "$(gh api "/users/$APP%5Bbot%5D" --jq .id)+$APP[bot]@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi
          status=0
          workline apply "$RUN" --from-merge-request "$NUMBER" --head "$HEAD_SHA" --forge github --summary workline-summary.md || status=$?
          [ ! -s workline-summary.md ] || cat workline-summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      # The state this answer ran on, whatever it wrote: answered,
      # refused, failed. The reconciler and a chained run start none
      # again on it, only on a new comment, objection or head. Not
      # when the agent was unreachable (status 3), propose stopped before
      # answering, or read no state: the next run tries again.
      - name: The answer's state
        if: always() && needs.propose.outputs.status != '' && needs.propose.outputs.status != '3'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          BRANCH: ${{ needs.propose.outputs.branch }}
          STATE: ${{ needs.propose.outputs.state }}
        run: |
          NUMBER=$(gh pr list --head "$BRANCH" --state open --json number,isCrossRepository --jq '[.[] | select(.isCrossRepository | not)][0].number // empty')
          [ -n "$NUMBER" ] || exit 0
          [ "$STATE" != unread ] || { echo "the state was not read: none marked, the reconciler may start it again"; exit 0; }
          workline test answer --merge-request "$NUMBER" --tried "$STATE" --forge github ||
            echo "::warning title=workline::the answer's state not written: the reconciler may start it again"
      # One answer a run: an answer applied, the next objection waiting is
      # answered by a new run, which ends at once with none left; 5 at
      # most in a chain, then the reconciler resumes.
      - name: The next answer
        if: success() && needs.propose.outputs.run != '' && fromJSON(inputs.chain || '0') < 4
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.propose.outputs.branch }}
          CHAIN: ${{ inputs.chain || '0' }}
        run: |
          gh workflow run workline-answer.yml --ref "$GITHUB_REF_NAME" -f branch="$BRANCH" -f chain="$((CHAIN + 1))" ||
            echo "::warning title=workline::the next answer not started: the reconciler starts it"
